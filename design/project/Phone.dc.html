<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:340px; flex:none; padding:8px; background:#0a0a0c; border-radius:38px; box-shadow:0 26px 60px rgba(20,18,17,0.28), inset 0 0 0 1px rgba(255,255,255,0.06);">
  <div data-sp="{{ theme }}" style="border-radius:30px; overflow:hidden; height:{{ h }}px; background:var(--sp-bg); color:var(--sp-text); display:flex; flex-direction:column; font-family:Archivo,system-ui,sans-serif;">
    <div style="height:38px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:8px 22px 0; font-size:13px; font-weight:800;">
      <span style="letter-spacing:-0.01em;">9:41</span>
      <div style="display:flex; gap:7px; align-items:center;">
        <svg width="17" height="11" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2.5" width="3" height="9.5"/><rect x="15" y="0" width="3" height="12"/></svg>
        <svg width="16" height="11" viewBox="0 0 20 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 5.5a12 12 0 0 1 16 0"/><path d="M5 9a7.5 7.5 0 0 1 10 0"/><path d="M8 12.5a3 3 0 0 1 4 0"/></svg>
        <svg width="25" height="12" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="21" height="12" rx="3" stroke="currentColor" opacity="0.45"/><rect x="2" y="2" width="15.5" height="9" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2.2" height="5" rx="1" fill="currentColor"/></svg>
      </div>
    </div>
    <div style="flex:1; min-height:0; display:flex; flex-direction:column;">{{ children }}</div>
    <sc-if value="{{ showTabs }}" hint-placeholder-val="{{ true }}">
      <div style="flex:none; display:flex; align-items:stretch; border-top:2px solid var(--sp-divider); background:var(--sp-bg);">
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 0 6px; color:{{ feedC }};">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
          <span style="font-size:10px; font-weight:800; letter-spacing:0.03em;">Feed</span>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 0 6px; color:{{ reportC }};">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="20" y2="14"/><line x1="12" x2="12" y1="20" y2="8"/><line x1="18" x2="18" y1="20" y2="4"/></svg>
          <span style="font-size:10px; font-weight:800; letter-spacing:0.03em;">Report</span>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 0 6px; color:{{ watchC }};">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span style="font-size:10px; font-weight:800; letter-spacing:0.03em;">Watchlist</span>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 0 6px; color:{{ setC }};">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
          <span style="font-size:10px; font-weight:800; letter-spacing:0.03em;">Settings</span>
        </div>
      </div>
    </sc-if>
    <div style="flex:none; height:22px; display:flex; align-items:center; justify-content:center; background:var(--sp-bg);"><div style="width:118px; height:4px; border-radius:2px; background:var(--sp-text); opacity:0.5;"></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:356,&quot;height&quot;:760},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;feed&quot;,&quot;report&quot;,&quot;watchlist&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;feed&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:720,&quot;tsType&quot;:&quot;number&quot;},&quot;showTabs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || null;
    const c = t => active === t ? 'var(--sp-accent)' : 'var(--sp-muted)';
    return {
      theme: this.props.theme || 'dark',
      h: this.props.h || 720,
      showTabs: this.props.showTabs !== false && this.props.showTabs !== 'false',
      feedC: c('feed'), reportC: c('report'), watchC: c('watchlist'), setC: c('settings'),
      children: this.props.children,
    };
  }
}
</script>
</body>
</html>
