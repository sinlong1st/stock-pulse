# StockPulse — always-on deployment (single container).
#
# The DB, rolling theme memory, and runtime prefs (the /language choice) are
# redirected into the ./data volume so they survive rebuilds. watchlist.json /
# keywords.json are your local config (copy
# them from the .example.json files before first run). Secrets come from .env.
services:
  stockpulse:
    build: .
    image: stockpulse:latest
    container_name: stockpulse
    restart: unless-stopped
    env_file: .env
    environment:
      # Keep persistent state on the mounted volume (overrides .env defaults).
      - DATABASE_URL=sqlite:////app/data/stockpulse.db
      - BRIEFING_MEMORY_FILE=/app/data/briefing_memory.json
      - PREFS_FILE=/app/data/runtime_prefs.json
      - PUSH_TOKENS_FILE=/app/data/push_tokens.json
      - STRATEGIES_FILE=/app/data/strategies.json
      - POSITIONS_FILE=/app/data/positions.json
    volumes:
      - ./data:/app/data
      # Writable: the /watch and /unwatch commands edit this file in place.
      - ./watchlist.json:/app/watchlist.json
      - ./keywords.json:/app/keywords.json:ro
    ports:
      # Bound to localhost only — reach the dashboard via an SSH tunnel:
      #   ssh -L 8000:127.0.0.1:8000 user@your-server
      # To expose it publicly, change to "8000:8000" and put auth in front.
      - "127.0.0.1:8000:8000"
